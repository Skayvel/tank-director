# Tank Run 综合控制中心 - 设置文件示例（v2.3.0-test）
# 说明：
#   1. 本文件是示例，不作为插件自动读取的配置文件。
#   2. 插件实际读取 `configs/tankrun_control_settings.cfg`（在游戏内改参数后自动生成）。
#   3. 如需手工套用，请复制为 `configs/tankrun_control_settings.cfg` 后执行
#      `sm_tank_reload` 或换图；格式为 “参数名=数值”，未知键会被忽略。
#   4. 引擎原生 ConVar（z_tank_throw_interval、tank_stuck_failsafe 等）不在此文件，使用菜单或
#      `sm_tank_set` 修改，原始值记录在 `configs/tankrun_control_originals.cfg`。

tankrun_enabled=1
tankrun_public_readonly=0
tankrun_debug=0
tankrun_log_events=1
tankrun_ai_only=1
tankrun_conflict_mode=0
tankrun_default_expert=1

# M02 生成调度与槽位回收
tankrun_auto_spawn=1
tankrun_auto_interval=2.000000
tankrun_auto_limit=30
tankrun_rotate_oldest=1
# 0=原版6秒 1=仅Tank Run次帧回收 2=全模式次帧回收
tankrun_fast_slot_reclaim=1
tankrun_auto_double=0
tankrun_spawn_mode=0

# M03 位置策略
# 0=跟随游戏难度 1=普通遮挡 2=高难度前线
tankrun_spawn_visibility=0
tankrun_spawn_min_dist=220.000000
tankrun_spawn_max_dist=3000.000000
tankrun_spawn_attempts=6
tankrun_spawn_fallback=1

# M04 / M08 目标与严格首石策略（方案 1b）
tankrun_target_mode=0
tankrun_target_fixed=0
tankrun_target_skip_incap=1
tankrun_target_hysteresis=200.000000
tankrun_target_scan=0.400000
tankrun_firstrock_enabled=1
# 0=全部严锁（默认）；1=远离幸存者(>130u)时允许拍车/破门，近身与对人命中仍严锁
tankrun_firstrock_allow_props=0
# 近距离无法出拳时落地立刻触发原版右键扔饼
tankrun_firstrock_quick_throw=1
tankrun_firstrock_quick_range=280.000000
# 0=禁用时间超时触发（方案 1b 默认）；正数=等待该秒数后恢复近战
tankrun_firstrock_timeout=0.000000
tankrun_firstrock_attempts=2

# M05 / M06 投石与视角控制
tankrun_rock_enabled=1
tankrun_rock_min_delay=0.000000
tankrun_rock_force_scale=1.000000
# 1=下勾斜抛，2=单手过肩，4=腰侧，8=双手过顶。累加多选，0=禁止 AI 投石。
tankrun_rock_types=15
tankrun_rock_no_turn=0
# 1=锁视角时仅锁水平 Yaw，保留引擎计算的俯仰抬角 Pitch，防石头砸脚
tankrun_rock_keep_loft=1
# 抬手后锁角模式等待 AI 完成转向的采样延迟（秒）
tankrun_rock_after_delay=0.350000
# 实验项：投石前摇被硬直中断时尝试清零体力减速惩罚
tankrun_rock_cancel_clear_stamina=0
tankrun_rock_recovery=0.750000
# 各抛法视角：0=原版跟随，1=锁定抬手前，2=锁定抬手后。
tankrun_rock_view_undercut=0
tankrun_rock_view_onehand=0
tankrun_rock_view_hip=0
tankrun_rock_view_twohand=0

# M07 拳击
tankrun_claw_damage_scale=1.000000
tankrun_claw_block_hit=0
# 1=上勾，2=右勾，4=左勾。累加多选，0=禁拳。距离上限 0=原版。
tankrun_claw_types_idle=7
tankrun_claw_types_rock=7
tankrun_claw_range_idle=0.000000
tankrun_claw_range_rock=0.000000

# M09 生命与伤害
tankrun_tank_health=0
tankrun_tank_maxhealth=0
tankrun_mode_health_sync=1
tankrun_tank_damage_scale=1.000000
tankrun_fire_damage_scale=1.000000
tankrun_speed_scale=1.000000

# 真人席位与流程节奏（仅 Tank Run 合作默认生效，谨慎保护非 Tank Run）
# 1=清理无主幸存者 Bot（含最后一人 AFK 清位归零），保留在线 AFK 替身至倒计时结束，入队按需补 Bot
tankrun_human_seats=1
# 挂机触发仅个人可见 10 秒倒计时的闲置时长（秒，0=关闭；自动托管原生 director_afk_timeout 防抢跑）
tankrun_afk_timeout=30
# 跳过战役关卡开场过场动画：0=关闭 1=仅 Tank Run 合作 2=所有合作
tankrun_skip_intro=1
# 缩短合作团灭结束演出与重开等待：0=关闭 1=仅 Tank Run 合作 2=所有合作
tankrun_fast_wipe=1
# 合作团灭后缩短到的重开等待与淡出时长（秒，原版 7.0）
tankrun_wipe_delay=1.500000

# v2.3 规则与二号菜单（!tank2）
# 取消生还者友伤（仅 Tank Run 合作默认开；保留自伤、感染者与真实环境伤害）
tankrun_no_friendly_fire=1
# 取消生还者水中减速（仅 Tank Run 合作默认开；使用原版 WaterSlowsMovement 机制）
tankrun_no_water_slowdown=1
# 投石仇恨提示（仅 Tank Run 合作，正式默认 0；内测可设 1）
tankrun_rock_target_glow=0
# 死门模式（仅改倒地即死，不切模式/不重启/不追杀已倒地玩家；也可由 !tank2 -> 模式选择 切换）
tankrun_deaths_door=0
# 骗拳处死（仅原版 AI Tank 与补位 Tank；也可由 !tank2 -> 处死选择 切换）
tankrun_bait_punch_slay=0
# 骗饼处死（仅 Tank Run 合作，原地等待原石正常终结结算；也可由 !tank2 -> 处死选择 切换）
tankrun_bait_rock_slay=0
