// Local listen-server profile for isolating the first-rock behavior.
sv_lan 1
sm_cvar tankrun_capacity_enabled 0
sm_cvar tankrun_auto_spawn 0
sm_cvar tankrun_rotate_oldest 0
sm_cvar tankrun_human_seats 1
sm_cvar tankrun_firstrock_enabled 1
sm_cvar tankrun_firstrock_timeout 10
sm_cvar tankrun_firstrock_attempts 5
sm_cvar tankrun_rock_enabled 1
sm_cvar tankrun_tick_telemetry 1
sm_tank_set tankrun_script_tank_limit 1
sm_tank_set tankrun_script_double_tanks 0
